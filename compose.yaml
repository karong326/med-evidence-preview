x-runtime: &runtime
  image: medevidence-preview:local
  build: .
  init: true
  read_only: true
  env_file:
    - ${MEDEVIDENCE_RUNTIME_ENV:?Set an external runtime environment file}
  environment:
    APP_HOST: 0.0.0.0
    APP_PORT: "8001"
    DATA_ROOT: /state
    CHROMA_PERSIST_DIRECTORY: /state/chroma
  volumes:
    - app-state:/state
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:17-bookworm
    env_file:
      - ${MEDEVIDENCE_DATABASE_ENV:?Set an external PostgreSQL environment file}
    volumes:
      - postgres-state:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -q -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-state:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 20

  app:
    <<: *runtime
    gpus: all
    volumes:
      - app-state:/state
      - type: bind
        source: ${MEDEVIDENCE_MODELS_DIR:?Set the external host directory containing local models}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${MEDEVIDENCE_BIND:-127.0.0.1}:${MEDEVIDENCE_PORT:-8001}:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/readyz', timeout=2).close()"
      interval: 10s
      timeout: 3s
      start_period: 120s
      retries: 3
    stop_grace_period: 6m

  maintenance:
    <<: *runtime
    profiles: [maintenance]
    command: [python, scripts/maintenance.py, --help]
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: [monitoring]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-state:/prometheus
    secrets:
      - metrics-token
    ports:
      - "127.0.0.1:${MEDEVIDENCE_PROMETHEUS_PORT:-9090}:9090"

secrets:
  metrics-token:
    file: ${MEDEVIDENCE_METRICS_TOKEN_FILE:-.metrics-token}

volumes:
  app-state:
  postgres-state:
  redis-state:
  prometheus-state:
