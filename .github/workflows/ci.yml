name: Preview checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python -m ruff check src tests scripts
      - run: python -m pyright --pythonpath "$(which python)"
      - run: python -m pytest -q tests
      - name: Atomic Redis integration on disposable service
        env:
          MEDEVIDENCE_TEST_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: python -m pytest -q tests/test_auth_atomic_redis.py
      - name: Verify public preview content
        run: python scripts/check_preview.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
