name: Preview checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_USER: test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        ports:
          - 127.0.0.1:6379:6379
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python -m ruff check src tests scripts
      - run: python -m pyright --pythonpath "$(which python)"
      - name: Offline suite and synthetic deployment on disposable services
        env:
          MEDEVIDENCE_TEST_POSTGRES_URL: postgresql+asyncpg://test:${{ github.run_id }}@127.0.0.1:5432/test
          MEDEVIDENCE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
          MEDEVIDENCE_TEST_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          # Use the same PostgreSQL major as the disposable service for backup/restore.
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          for tool in pg_dump pg_restore psql; do
            version=$("/usr/lib/postgresql/16/bin/$tool" --version)
            printf '%s\n' "$version"
            [[ "$version" == *"(PostgreSQL) 16."* ]]
          done
          python -m pytest -q -rs tests
      - name: Verify public preview content
        run: python scripts/check_preview.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
